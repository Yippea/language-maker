<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENIGMA M3 - Advanced Simulation</title>
<style>
  @import url(\'https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Special+Elite&display=swap\');
  :root{ --bg:#0f1410; --panel:#1a1f1b; --metal:#2a2f2a; --brass:#c5a059; --brass-dim:#8a6d3b; --lamp:#ffcc33; --lamp-glow:#ff9900; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:#e8e0d0;font-family:\'JetBrains Mono\',monospace;min-height:100vh;padding:20px}
  h1{font-family:\'Special Elite\',monospace;text-align:center;letter-spacing:0.4em;color:var(--brass);font-size:2.2rem;text-shadow:0 0 20px rgba(197,160,89,0.3)}
  .subtitle{text-align:center;color:#777;font-size:0.75rem;letter-spacing:0.3em;margin-bottom:20px}
  .machine{max-width:1100px;margin:0 auto;background:linear-gradient(180deg,#232823,#141814);border:2px solid #333;border-radius:16px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05)}
  
  /* Rotor Assembly */
  .rotor-assembly{display:flex;justify-content:center;gap:16px;margin:20px 0;padding:20px;background:#0a0c0a;border-radius:12px;border:1px solid #2a2f2a}
  .reflector-box{width:90px;background:#111;border:1px solid var(--brass-dim);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--brass);font-size:0.7rem;padding:10px}
  .rotor-unit{width:110px;background:linear-gradient(180deg,#2b2b2b,#1a1a1a);border:2px solid #444;border-radius:10px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;box-shadow:inset 0 2px 10px rgba(0,0,0,0.5)}
  .rotor-unit.active{border-color:var(--brass);box-shadow:0 0 15px rgba(197,160,89,0.4)}
  .rotor-number{font-size:0.6rem;color:#888;letter-spacing:0.2em}
  .rotor-window{width:60px;height:60px;background:#000;border-radius:50%;border:3px solid #333;display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:700;color:var(--lamp);text-shadow:0 0 10px var(--lamp-glow);transition:transform 0.2s}
  .rotor-controls{display:flex;flex-direction:column;gap:4px;width:100%}
  .rotor-controls select, .rotor-controls input{width:100%;background:#000;color:var(--brass);border:1px solid #333;border-radius:4px;padding:4px;font-family:inherit;font-size:0.7rem;text-align:center}
  .rotor-controls label{font-size:0.55rem;color:#666;text-align:center}
  .step-btn{background:#222;border:1px solid #444;color:#aaa;border-radius:4px;cursor:pointer;font-size:0.7rem;padding:2px}
  .step-btn:hover{background:var(--brass);color:#000}

  /* Plugboard */
  .plugboard{background:#0d0f0d;border:1px solid #222;border-radius:12px;padding:16px;margin:20px 0}
  .plugboard h3{color:var(--brass);font-size:0.8rem;letter-spacing:0.3em;text-align:center;margin-bottom:12px}
  .plug-letters{display:grid;grid-template-columns:repeat(13,1fr);gap:6px}
  .plug-letter{background:#1a1a1a;border:2px solid #333;border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;transition:all 0.2s;position:relative;font-size:0.9rem}
  .plug-letter:hover{border-color:#666}
  .plug-letter.connected{background:#2a2210;border-color:var(--brass);color:var(--lamp);box-shadow:0 0 10px rgba(197,160,89,0.3)}
  .plug-letter.selected{border-color:#fff;transform:scale(1.1)}
  svg.plug-wires{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}

  /* Keyboard & Lampboard */
  .boards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px 0}
  .board{background:#080a08;border-radius:12px;padding:16px;border:1px solid #222}
  .board h3{text-align:center;font-size:0.7rem;letter-spacing:0.3em;color:#666;margin-bottom:12px}
  .keys{display:flex;flex-direction:column;align-items:center;gap:6px}
  .key-row{display:flex;gap:6px}
  .key{width:54px;height:54px;background:linear-gradient(180deg,#2a2a2a,#1a1a1a);border:1px solid #333;border-bottom:3px solid #000;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;user-select:none;transition:all 0.05s}
  .key:active, .key.pressed{transform:translateY(2px);border-bottom-width:1px;background:#111}
  .lamp{width:54px;height:54px;background:#1a1a1a;border-radius:50%;border:2px solid #222;display:flex;align-items:center;justify-content:center;font-weight:700;color:#333;transition:all 0.1s}
  .lamp.on{background:radial-gradient(circle,#fff8cc,var(--lamp));color:#000;border-color:var(--lamp-glow);box-shadow:0 0 20px var(--lamp-glow), 0 0 40px var(--lamp-glow);transform:scale(1.05)}

  /* I/O */
  .io{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
  .io-box{background:#000;border:1px solid #333;border-radius:8px;padding:12px}
  .io-box label{font-size:0.6rem;color:var(--brass);letter-spacing:0.2em}
  .io-box textarea{width:100%;height:110px;background:transparent;border:none;color:#e8e0d0;font-family:\'Special Elite\',monospace;font-size:1.1rem;letter-spacing:0.15em;resize:none;outline:none;margin-top:8px}
  .tape{font-family:\'Special Elite\',monospace;background:#f4e8c1;color:#222;padding:10px;min-height:40px;letter-spacing:0.2em;word-break:break-all;border-radius:4px;box-shadow:inset 0 2px 5px rgba(0,0,0,0.2)}
  .controls-row{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .btn{background:var(--brass);color:#000;border:none;padding:8px 16px;border-radius:6px;font-family:inherit;font-weight:700;cursor:pointer;letter-spacing:0.1em;font-size:0.75rem}
  .btn.secondary{background:#222;color:#ccc;border:1px solid #444}
  .btn:hover{filter:brightness(1.1)}
  @media(max-width:800px){.boards,.io{grid-template-columns:1fr}.plug-letters{grid-template-columns:repeat(7,1fr)}}
</style>
</head>
<body>
<h1>ENIGMA M3</h1>
<p class="subtitle">HEERES • ENIGMA • SIMULATOR — TYPE M3 • 3-ROTOR</p>

<div class="machine">
  <!-- Rotor Assembly -->
  <div class="rotor-assembly" id="rotorAssembly">
    <!-- JS will inject rotors -->
  </div>

  <!-- Plugboard -->
  <div class="plugboard">
    <h3>STECKERBRETT — CLICK TWO LETTERS TO CONNECT</h3>
    <div class="plug-letters" id="plugboard"></div>
    <p style="text-align:center;color:#555;font-size:0.65rem;margin-top:8px" id="plugInfo">0 / 10 pairs connected</p>
  </div>

  <div class="boards">
    <div class="board">
      <h3>LAMPBOARD</h3>
      <div class="keys" id="lampboard"></div>
    </div>
    <div class="board">
      <h3>KEYBOARD</h3>
      <div class="keys" id="keyboard"></div>
    </div>
  </div>

  <div class="io">
    <div class="io-box">
      <label>EINGABE / INPUT (TYPE HERE)</label>
      <textarea id="input" placeholder="TYPE YOUR MESSAGE..."></textarea>
    </div>
    <div class="io-box">
      <label>AUSGABE / OUTPUT — <span style="color:#888">CLICK TO COPY</span></label>
      <div class="tape" id="outputTape" onclick="navigator.clipboard.writeText(this.innerText)"></div>
      <div style="color:#555;font-size:0.6rem;margin-top:6px">Grouped in 5s like original procedure</div>
    </div>
  </div>

  <div class="controls-row">
    <button class="btn secondary" onclick="clearAll()">CLEAR</button>
    <button class="btn secondary" onclick="randomize()">RANDOM SETTINGS</button>
    <button class="btn" onclick="copyOutput()">COPY OUTPUT</button>
  </div>
</div>

<script>
const ALPH = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const ROTORS = {
  "I":   {wiring:"EKMFLGDQVZNTOWYHXUSPAIBRCJ", notch:"Q"},
  "II":  {wiring:"AJDKSIRUXBLHWTMCQGZNPYFVOE", notch:"E"},
  "III": {wiring:"BDFHJLCPRTXVZNYEIWGAKMUSQO", notch:"V"},
  "IV":  {wiring:"ESOVPZJAYQUIRHXLNFTGKDCMWB", notch:"J"},
  "V":   {wiring:"VZBRGITYUPSDNHLXAWMJQOFECK", notch:"Z"},
  "VI":  {wiring:"JPGVOUMFYQBENHZRDKASXLICTW", notch:"ZM"},
  "VII": {wiring:"NZJHGRCXMYSWBOUFAIVLPEKQDT", notch:"ZM"},
  "VIII":{wiring:"FKQHTLXOCBJSPDZRAMEWNIUYGV", notch:"ZM"},
};
const REFLECTORS = {
  "B":"YRUHQSLDPXNGOKMIEBFZCWVJAT",
  "C":"FVPJIAOYEDRZXWGCTKUQSBNMHL"
};

let state = {
  rotors: [
    {type:"I", pos:0, ring:0},
    {type:"II", pos:0, ring:0},
    {type:"III", pos:0, ring:0},
  ],
  reflector:"B",
  plugboard:{},
  selectedPlug:null
};

function idx(c){return ALPH.indexOf(c)}
function charAt(i){return ALPH[(i+26)%26]}

function buildPlugboard(){
  const el=document.getElementById(\'plugboard\');
  el.innerHTML=\'\';
  ALPH.split(\'\').forEach(l=>{
    const d=document.createElement(\'div\');
    d.className=\'plug-letter\';
    d.textContent=l;
    d.id=\'plug-\'+l;
    d.onclick=()=>togglePlug(l);
    el.appendChild(d);
  });
  updatePlugUI();
}
function togglePlug(l){
  if(state.selectedPlug===l){state.selectedPlug=null;updatePlugUI();return}
  if(!state.selectedPlug){
    if(state.plugboard[l]){ // disconnect
      let other=state.plugboard[l];
      delete state.plugboard[l]; delete state.plugboard[other];
      updatePlugUI(); encryptAll(); return;
    }
    state.selectedPlug=l; updatePlugUI(); return;
  }
  let a=state.selectedPlug, b=l;
  if(state.plugboard[a]){let o=state.plugboard[a]; delete state.plugboard[a]; delete state.plugboard[o];}
  if(state.plugboard[b]){let o=state.plugboard[b]; delete state.plugboard[b]; delete state.plugboard[o];}
  if(a!==b && Object.keys(state.plugboard).length < 20){
    state.plugboard[a]=b; state.plugboard[b]=a;
  }
  state.selectedPlug=null; updatePlugUI(); encryptAll();
}
function updatePlugUI(){
  document.querySelectorAll(\'.plug-letter\').forEach(e=>{
    let l=e.textContent; e.classList.remove(\'connected\',\'selected\');
    if(state.plugboard[l]) e.classList.add(\'connected\');
    if(state.selectedPlug===l) e.classList.add(\'selected\');
  });
  document.getElementById(\'plugInfo\').textContent = `${Object.keys(state.plugboard).length/2} / 10 pairs connected`;
}

function buildRotors(){
  const wrap=document.getElementById(\'rotorAssembly\');
  wrap.innerHTML=\'\';
  // Reflector
  const ref=document.createElement(\'div\'); ref.className=\'reflector-box\';
  ref.innerHTML=`<div>REFLECTOR</div><select id="refSel" style="margin-top:6px;background:#000;color:var(--brass);border:1px solid #333;width:60px;text-align:center"><option value="B">UKW-B</option><option value="C">UKW-C</option></select>`;
  wrap.appendChild(ref);
  ref.querySelector(\'select\').value=state.reflector;
  ref.querySelector(\'select\').onchange=e=>{state.reflector=e.target.value; encryptAll()};

  state.rotors.forEach((r,i)=>{
    const d=document.createElement(\'div\'); d.className=\'rotor-unit\'; d.id=\'rotor-\'+i;
    d.innerHTML=`
      <div class="rotor-number">ROTOR ${i+1}</div>
      <div class="rotor-window" id="win-${i}">${charAt(r.pos)}</div>
      <div style="display:flex;gap:4px"><button class="step-btn" onclick="stepRotor(${i},1)">▲</button><button class="step-btn" onclick="stepRotor(${i},-1)">▼</button></div>
      <div class="rotor-controls">
        <label>TYPE</label><select id="type-${i}">${Object.keys(ROTORS).map(k=>`<option ${k===r.type?\'selected\':\'\'}>${k}</option>`).join(\'\')}</select>
        <label>POSITION (Grundstellung)</label><select id="pos-${i}">${ALPH.split(\'\').map((c,j)=>`<option value="${j}" ${j===r.pos?\'selected\':\'\'}>${c}</option>`).join(\'\')}</select>
        <label>RING (Ringstellung)</label><select id="ring-${i}">${ALPH.split(\'\').map((c,j)=>`<option value="${j}" ${j===r.ring?\'selected\':\'\'}>${c}</option>`).join(\'\')}</select>
      </div>
    `;
    wrap.appendChild(d);
  });
  // bind changes
  state.rotors.forEach((_,i)=>{
    document.getElementById(`type-${i}`).onchange=e=>{state.rotors[i].type=e.target.value; encryptAll()}
    document.getElementById(`pos-${i}`).onchange=e=>{state.rotors[i].pos=parseInt(e.target.value); updateWindows()}
    document.getElementById(`ring-${i}`).onchange=e=>{state.rotors[i].ring=parseInt(e.target.value); encryptAll()}
  });
  updateWindows();
}
function stepRotor(i,dir){
  state.rotors[i].pos=(state.rotors[i].pos+dir+26)%26;
  document.getElementById(`pos-${i}`).value=state.rotors[i].pos;
  updateWindows(); encryptAll();
}
function updateWindows(){
  state.rotors.forEach((r,i)=>{
    document.getElementById(`win-${i}`).textContent=charAt(r.pos);
    document.getElementById(`rotor-${i}`).classList.toggle(\'active\', i===2);
  });
}

function buildBoards(){
  const rows=["QWERTZUIO","ASDFGHJK","PYXCVBNML"];
  const kb=document.getElementById(\'keyboard\'), lb=document.getElementById(\'lampboard\');
  function makeBoard(container, isLamp){
    container.innerHTML=\'\';
    rows.forEach(row=>{
      const r=document.createElement(\'div\'); r.className=\'key-row\';
      row.split(\'\').forEach(ch=>{
        const el=document.createElement(\'div\'); el.className=isLamp?\'lamp\':\'key\'; el.textContent=ch; el.id=(isLamp?\'lamp-\':\'key-\')+ch;
        if(!isLamp){
          el.onmousedown=()=>handlePress(ch);
          el.onmouseup=()=>handleRelease(ch);
          el.ontouchstart=e=>{e.preventDefault(); handlePress(ch)};
          el.ontouchend=e=>{e.preventDefault(); handleRelease(ch)};
        }
        r.appendChild(el);
      });
      container.appendChild(r);
    });
  }
  makeBoard(kb,false); makeBoard(lb,true);
  document.addEventListener(\'keydown\',e=>{
    let k=e.key.toUpperCase(); if(ALPH.includes(k)){ e.preventDefault(); handlePress(k) }
  });
  document.addEventListener(\'keyup\',e=>{
    let k=e.key.toUpperCase(); if(ALPH.includes(k)) handleRelease(k)
  });
}

let lampTimeout=null;
function handlePress(ch){
  document.getElementById(\'key-\'+ch)?.classList.add(\'pressed\');
  let out = encryptChar(ch);
  lightLamp(out);
  // append to input
  const inp=document.getElementById(\'input\');
  inp.value+=ch; encryptAll(false);
}
function handleRelease(ch){
  document.getElementById(\'key-\'+ch)?.classList.remove(\'pressed\');
  // unlight after delay
  clearTimeout(lampTimeout); lampTimeout=setTimeout(()=>document.querySelectorAll(\'.lamp.on\').forEach(e=>e.classList.remove(\'on\')),400);
}
function lightLamp(ch){
  document.querySelectorAll(\'.lamp.on\').forEach(e=>e.classList.remove(\'on\'));
  document.getElementById(\'lamp-\'+ch)?.classList.add(\'on\');
  // sound tick
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(); const g=ctx.createGain();
    o.frequency.value=800; g.gain.value=0.05; o.connect(g); g.connect(ctx.destination); o.start(); g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.08); o.stop(ctx.currentTime+0.08);
  }catch(e){}
}

// Core Enigma Logic
function plugSwap(c){
  return state.plugboard[c] || c;
}
function rotorForward(c, rotor){
  let wiring = ROTORS[rotor.type].wiring;
  let offset = rotor.pos - rotor.ring;
  let cIdx = (idx(c) + offset + 26)%26;
  let wired = idx(wiring[cIdx]);
  return charAt((wired - offset + 26)%26);
}
function rotorBackward(c, rotor){
  let wiring = ROTORS[rotor.type].wiring;
  let offset = rotor.pos - rotor.ring;
  let cIdx = (idx(c) + offset + 26)%26;
  let wiredIdx = wiring.indexOf(charAt(cIdx));
  return charAt((wiredIdx - offset + 26)%26);
}
function reflector(c){
  let wiring = REFLECTORS[state.reflector];
  return wiring[idx(c)];
}
function stepRotors(){
  let r = state.rotors;
  // Check notches before stepping
  let middleAtNotch = ROTORS[r[1].type].notch.includes(charAt(r[1].pos));
  let rightAtNotch = ROTORS[r[2].type].notch.includes(charAt(r[2].pos));
  
  if(middleAtNotch) { // double step: left + middle
    r[0].pos=(r[0].pos+1)%26;
    r[1].pos=(r[1].pos+1)%26;
  } else if(rightAtNotch){
    r[1].pos=(r[1].pos+1)%26;
  }
  r[2].pos=(r[2].pos+1)%26;
  updateWindows();
  // sync selects
  r.forEach((rotor,i)=> document.getElementById(`pos-${i}`).value=rotor.pos);
}

function encryptChar(c){
  if(!ALPH.includes(c)) return c;
  stepRotors();
  c = plugSwap(c);
  // right to left through rotors 2,1,0
  c = rotorForward(c, state.rotors[2]);
  c = rotorForward(c, state.rotors[1]);
  c = rotorForward(c, state.rotors[0]);
  c = reflector(c);
  // left to right back
  c = rotorBackward(c, state.rotors[0]);
  c = rotorBackward(c, state.rotors[1]);
  c = rotorBackward(c, state.rotors[2]);
  c = plugSwap(c);
  return c;
}

// Encrypt full text without affecting lamp but stepping correctly
function encryptAll(updateInput=true){
  // Save positions, reset to start positions from UI, then encrypt incrementally
  let startPos = state.rotors.map(r=>r.pos);
  // need to capture start before stepping - so copy
  let input = document.getElementById(\'input\').value.toUpperCase().replace(/[^A-Z]/g,\'\');
  // Reset rotors to start for calculation
  // We already stepped during typing, so we need to re-simulate from beginning
  // To do that, we store initial positions separately
  // Simple: Reset to what was before encryption, then run through
  // For this implementation, we snapshot the current window positions as start and simulate without mutating real stepping for output
  let tempRotors = state.rotors.map(r=>({...r, pos: startPos[ state.rotors.indexOf(r) ]}));
  // But we need the *initial* positions before any typing. We use the select values as truth.
  let initialPos = state.rotors.map((_,i)=> parseInt(document.getElementById(`pos-${i}`).value));
  tempRotors = state.rotors.map((r,i)=>({...r, pos: initialPos[i]}));

  let out="";
  function tempStep(){
    let r=tempRotors;
    let mAt=ROTORS[r[1].type].notch.includes(charAt(r[1].pos));
    let rAt=ROTORS[r[2].type].notch.includes(charAt(r[2].pos));
    if(mAt){ r[0].pos=(r[0].pos+1)%26; r[1].pos=(r[1].pos+1)%26; }
    else if(rAt){ r[1].pos=(r[1].pos+1)%26; }
    r[2].pos=(r[2].pos+1)%26;
  }
  function tempEnc(c){
    tempStep();
    c = state.plugboard[c] || c;
    c = (()=>{
      let off=tempRotors[2].pos-tempRotors[2].ring; let w=ROTORS[tempRotors[2].type].wiring; let ci=(idx(c)+off+26)%26; return charAt((idx(w[ci])-off+26)%26);
    })();
    c = (()=>{
      let off=tempRotors[1].pos-tempRotors[1].ring; let w=ROTORS[tempRotors[1].type].wiring; let ci=(idx(c)+off+26)%26; return charAt((idx(w[ci])-off+26)%26);
    })();
    c = (()=>{
      let off=tempRotors[0].pos-tempRotors[0].ring; let w=ROTORS[tempRotors[0].type].wiring; let ci=(idx(c)+off+26)%26; return charAt((idx(w[ci])-off+26)%26);
    })();
    c = REFLECTORS[state.reflector][idx(c)];
    c = (()=>{
      let off=tempRotors[0].pos-tempRotors[0].ring; let w=ROTORS[tempRotors[0].type].wiring; let ci=(idx(c)+off+26)%26; return charAt((w.indexOf(charAt(ci))-off+26)%26);
    })();
    c = (()=>{
      let off=tempRotors[1].pos-tempRotors[1].ring; let w=ROTORS[tempRotors[1].type].wiring; let ci=(idx(c)+off+26)%26; return charAt((w.indexOf(charAt(ci))-off+26)%26);
    })();
    c = (()=>{
      let off=tempRotors[2].pos-tempRotors[2].ring; let w=ROTORS[tempRotors[2].type].wiring; let ci=(idx(c)+off+26)%26; return charAt((w.indexOf(charAt(ci))-off+26)%26);
    })();
    c = state.plugboard[c] || c;
    return c;
  }
  for(let ch of input) out+=tempEnc(ch);
  
  // Group in 5s
  let grouped = out.match(/.{1,5}/g)?.join(\' \') || \'\';
  document.getElementById(\'outputTape\').textContent = grouped;
  // Also update windows to reflect final position after full text if not typing char-by-char
  if(input.length>0){
    tempRotors.forEach((r,i)=>{ state.rotors[i].pos=r.pos; });
    updateWindows();
    state.rotors.forEach((_,i)=> document.getElementById(`pos-${i}`).value=state.rotors[i].pos);
  }
}

document.getElementById(\'input\').addEventListener(\'input\',()=>encryptAll());
function clearAll(){document.getElementById(\'input\').value=\'\'; encryptAll()}
function copyOutput(){navigator.clipboard.writeText(document.getElementById(\'outputTape\').textContent); alert(\'Copied to clipboard\')}
function randomize(){
  state.rotors.forEach((r,i)=>{
    let types=Object.keys(ROTORS); r.type=types[Math.floor(Math.random()*5)]; r.pos=Math.floor(Math.random()*26); r.ring=Math.floor(Math.random()*26);
  });
  state.reflector=Math.random()>0.5?\'B\':\'C\';
  state.plugboard={}; // 5 random pairs
  let letters=[...ALPH]; 
  for(let i=0;i<5;i++){ 
    let a=letters.splice(Math.floor(Math.random()*letters.length),1)[0];
    let b=letters.splice(Math.floor(Math.random()*letters.length),1)[0];
    state.plugboard[a]=b; state.plugboard[b]=a;
  }
  buildRotors(); updatePlugUI(); document.getElementById(\'input\').value=\'\'; encryptAll();
}
